
name: Cam Online Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cam-online-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check monitor setup
        run: |
          echo "Monitor workflow is running."
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Data collection script will be added next."
